        <h1 class="hero-tagline">Songs of Faith, Echoes of Grace</h1>
        <div class="landing-language-switch" role="group" aria-label="文字版本" data-i18n-aria="language">
          <button type="button" data-language="zh-Hant" aria-pressed="true">繁體</button>

        <button id="enter-app-btn" class="enter-app-btn" data-i18n="enterApp">進入詩歌</button>

      <!-- Input field -->

    <div class="container" id="app"></div>
    <div id="hymn-actions" class="hymn-actions" hidden>
      <button id="save-hymn-btn" type="button" aria-pressed="false">★ 收藏</button>
      <button id="collection-open-btn" type="button">我的收藏</button>
    </div>
    <p id="collection-feedback" class="collection-feedback" role="status" aria-live="polite"></p>

        <div class="settings-header">

          <button type="button" id="close-settings-btn" class="settings-close-btn" aria-label="關閉設定" data-i18n-aria="closeSettings">&times;</button>
        </div>
        <div class="settings-row">
          <div>
            <strong data-i18n="language">文字版本</strong>

          </div>
          <div class="settings-language-switch" role="group" aria-label="文字版本" data-i18n-aria="language">
            <button type="button" data-language="zh-Hant" aria-pressed="true">繁體</button>
            <button type="button" data-language="zh-Hans" aria-pressed="false">简体</button>
          </div>
        </div>
        <div class="settings-row">
          <div>
            <strong data-i18n="fontSize">字體大小</strong>
            <small data-i18n="fontDescription">調整詩歌歌詞大小</small>
          </div>
          <div class="settings-font-controls">

    <main id="admin-add-hymn-page" class="admin-page" hidden>
      <div class="admin-shell">
        <div class="admin-header">
          <div>
            <h1>Manage Hymns</h1>
            <p>Add, view, edit, and delete hymns.</p>
          </div>
          <a href="/" class="admin-link">Back to app</a>
        </div>

        <form id="admin-login-form" class="admin-form">
          <label>
            Admin token
            <input id="admin-token" type="password" autocomplete="current-password" required>
          </label>
          <div class="admin-actions"><button id="admin-login-btn" type="submit">Sign in</button></div>
          <p id="admin-login-status" class="admin-status" role="status"></p>
        </form>

        <div id="admin-manager" hidden>
          <div class="admin-tabs" role="tablist" aria-label="Hymn management">
            <button id="admin-add-tab" type="button" role="tab" aria-controls="admin-add-panel" aria-selected="false" tabindex="-1">Add hymn</button>
            <button id="admin-list-tab" type="button" role="tab" aria-controls="admin-list-panel" aria-selected="true">List hymns</button>
          </div>
          <p id="admin-status" class="admin-status" role="status"></p>
          <div id="admin-list-panel" role="tabpanel" aria-labelledby="admin-list-tab">
          <section class="admin-form" aria-label="Hymn list">
            <div class="admin-actions admin-toolbar"><button id="admin-refresh-btn" type="button">Refresh</button></div>
            <label>Search hymns <input id="admin-list-search" type="search" placeholder="Number, title, or lyrics"></label>
            <p id="admin-count"></p>
            <div id="admin-hymn-list"></div>
          </section>
          </div>
          <div id="admin-add-panel" role="tabpanel" aria-labelledby="admin-add-tab" hidden>
        <form id="admin-add-hymn-form" class="admin-form" hidden>
          <h2 id="admin-editor-heading">Add hymn</h2>

          <div class="admin-grid">
            <label>
              Hymn number
              <input id="admin-hymn-id" type="text" inputmode="numeric" required readonly>
              <small id="admin-number-help">Assigned automatically when saved, starting at 001.</small>
            </label>

            <label>
              Edition
              <input id="admin-edition" type="text" value="ts" readonly>
              <small>小本 · Saved in dynamicHymns.</small>
            </label>
          </div>

          <label>
            Title
            <input id="admin-title" type="text">
          </label>

          <label>
            YouTube URL (optional)
            <input id="admin-youtube-url" type="url" placeholder="https://youtu.be/…" aria-describedby="admin-youtube-help">
            <small id="admin-youtube-help">Add a YouTube video link to show with this hymn. Leave blank if there is no video.</small>
          </label>

          <label>
            Hymn lyrics (plain text, Traditional Chinese only)
            <textarea id="admin-lyrics" rows="12" required aria-describedby="admin-lyrics-help admin-lyrics-example"></textarea>
            <small id="admin-lyrics-help">Paste Traditional Chinese lyrics from your .txt file. The app automatically displays Simplified Chinese when selected in settings. Keep a blank line between sections, then choose Verse or Chorus below. You can also put [副歌] or [Chorus] on its own line before a chorus. Choruses display 副歌 and do not count as numbered verses. HTML is generated automatically.</small>
            <small>Example format:</small>
            <pre id="admin-lyrics-example" class="admin-lyrics-example">lyrics
xxx

[chorus]
xxx</pre>
          </label>
          <fieldset class="admin-section-types">
            <legend>Lyric sections · 主歌 / 副歌</legend>
            <div id="admin-section-types"></div>
          </fieldset>

          <details>
            <summary>Generated HTML</summary>
            <label>Hymn HTML <textarea id="admin-html" rows="8" readonly></textarea></label>
          </details>

          <label>
            Search text (optional)
            <textarea id="admin-search-text" rows="3" aria-describedby="admin-search-help"></textarea>
            <small id="admin-search-help">Add extra search keywords, alternate titles, or spellings. The hymn number, title, and lyrics are already searchable. Leave blank to use the title and lyrics automatically. This text is not displayed as lyrics.</small>
          </label>

          <label class="admin-checkbox">
            <input id="admin-published" type="checkbox" checked>
            Publish immediately
          </label>

          <div class="admin-actions">
            <button id="admin-save-btn" type="submit">Save Hymn</button>
            <button type="button" id="admin-preview-btn">Preview</button>
            <button type="button" id="admin-cancel-btn">Close</button>
            <button type="button" id="admin-delete-btn" class="admin-danger" hidden>Delete hymn</button>
          </div>

          <p id="admin-save-feedback" class="admin-save-feedback" hidden></p>
        </form>

        <section id="admin-preview" class="admin-preview" aria-label="Hymn preview" tabindex="-1" hidden>
          <h2>Preview</h2>
          <div id="admin-preview-content" class="hymn-content"></div>
        </section>
          </div>
        <div id="admin-save-toast" class="admin-save-toast" role="status" aria-live="polite" aria-atomic="true" hidden>
          <span aria-hidden="true">✓</span>
          <span id="admin-save-toast-message"></span>
          <button id="admin-save-toast-close" type="button" aria-label="Dismiss success message">×</button>
        </div>
        </div>
      </div>
    </main>

    <script>
        // Only register service worker in production (not localhost)
        if ('serviceWorker' in navigator) {
            const isProduction = window.location.hostname !== 'localhost' &&
                                window.location.hostname !== '127.0.0.1';

            if (isProduction) {
                navigator.serviceWorker.register('/service-worker.js', { updateViaCache: 'none' })
                    .then(registration => {
                        console.log('Service Worker registered with scope:', registration.scope);

                        const showUpdateButton = onUpdate => {
                            let button = document.getElementById('pwa-update-btn');

                            if (!button) {
                                button = document.createElement('button');
                                button.id = 'pwa-update-btn';
                                button.type = 'button';
                                button.textContent = '更新';
                                button.style.cssText = 'position:fixed;left:50%;bottom:18px;z-index:9999;transform:translateX(-50%);padding:12px 18px;border:0;border-radius:999px;background:#111;color:#fff;font:600 16px system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.24);';
                                document.body.appendChild(button);
                            }

                            button.onclick = onUpdate;
                        };

                        if (registration.waiting) {
                            const waitingWorker = registration.waiting;
                            showUpdateButton(() => {
                                waitingWorker.postMessage({ type: 'SKIP_WAITING' });
                            });
                        }

                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;

                            if (!newWorker) {
                                return;
                            }

                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    showUpdateButton(() => {
                                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                                    });
                                }
                            });
                        });

                        const currentAssetSignature = () => {
                            const assets = [
                                ...document.querySelectorAll('script[src*="/assets/"], link[href*="/assets/"]')
                            ].map(element => element.src || element.href);

                            return assets.sort().join('|');
                        };

                        const initialAssetSignature = currentAssetSignature();
                        const checkForAppShellUpdate = async () => {
                            if (!initialAssetSignature) {
                                return;
                            }

                            const response = await fetch('/index.html', { cache: 'reload' });
                            const html = await response.text();
                            const doc = new DOMParser().parseFromString(html, 'text/html');
                            const nextSignature = [
                                ...doc.querySelectorAll('script[src*="/assets/"], link[href*="/assets/"]')
                            ].map(element => new URL(element.getAttribute('src') || element.getAttribute('href'), location.origin).href)
                                .sort()
                                .join('|');

                            if (nextSignature && nextSignature !== initialAssetSignature) {
                                showUpdateButton(() => window.location.reload());
                            }
                        };

                        const checkForUpdates = () => {
                            registration.update().catch(() => {});
                            checkForAppShellUpdate().catch(() => {});
                        };
                        window.addEventListener('focus', checkForUpdates);
                        document.addEventListener('visibilitychange', () => {
                            if (document.visibilityState === 'visible') {
                                checkForUpdates();
                            }
                        });
                        checkForUpdates();
                    })
                    .catch(error => {
                        console.log('Service Worker registration failed:', error);
                    });

                let refreshing = false;
                const hadController = Boolean(navigator.serviceWorker.controller);
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (hadController && !refreshing) {
                        refreshing = true;
                        window.location.reload();
                    }
                });
            } else {
                console.log('Service Worker disabled in development mode');
            }
        }
    </script>
