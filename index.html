    <script>
        // Only register service worker in production (not localhost)
        if ('serviceWorker' in navigator) {
            const isProduction = window.location.hostname !== 'localhost' &&
                                window.location.hostname !== '127.0.0.1';

            if (isProduction) {
                navigator.serviceWorker.register('service-worker.js')
                    .then(registration => {
                        console.log('Service Worker registered with scope:', registration.scope);

                        const showUpdateButton = onUpdate => {
                            let button = document.getElementById('pwa-update-btn');

                            if (!button) {
                                button = document.createElement('button');
                                button.id = 'pwa-update-btn';
                                button.type = 'button';
                                button.textContent = 'Update';
                                button.style.cssText = 'position:fixed;left:50%;bottom:18px;z-index:9999;transform:translateX(-50%);padding:12px 18px;border:0;border-radius:999px;background:#111;color:#fff;font:600 16px system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.24);';
                                document.body.appendChild(button);
                            }

                            button.onclick = onUpdate;
                        };

                        if (registration.waiting) {
                            const waitingWorker = registration.waiting;
                            showUpdateButton(() => {
                                waitingWorker.postMessage({ type: 'SKIP_WAITING' });
                            });
                        }

                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;

                            if (!newWorker) {
                                return;
                            }

                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    showUpdateButton(() => {
                                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                                    });
                                }
                            });
                        });

                        const currentAssetSignature = () => {
                            const assets = [
                                ...document.querySelectorAll('script[src*="/assets/"], link[href*="/assets/"]')
                            ].map(element => element.src || element.href);

                            return assets.sort().join('|');
                        };

                        const initialAssetSignature = currentAssetSignature();
                        const checkForAppShellUpdate = async () => {
                            if (!initialAssetSignature) {
                                return;
                            }

                            const response = await fetch('/index.html', { cache: 'reload' });
                            const html = await response.text();
                            const doc = new DOMParser().parseFromString(html, 'text/html');
                            const nextSignature = [
                                ...doc.querySelectorAll('script[src*="/assets/"], link[href*="/assets/"]')
                            ].map(element => new URL(element.getAttribute('src') || element.getAttribute('href'), location.origin).href)
                                .sort()
                                .join('|');

                            if (nextSignature && nextSignature !== initialAssetSignature) {
                                showUpdateButton(() => window.location.reload());
                            }
                        };

                        const checkForUpdates = () => {
                            registration.update().catch(() => {});
                            checkForAppShellUpdate().catch(() => {});
                        };
                        window.addEventListener('focus', checkForUpdates);
                        document.addEventListener('visibilitychange', () => {
                            if (document.visibilityState === 'visible') {
                                checkForUpdates();
                            }
                        });
                        checkForUpdates();
                    })
                    .catch(error => {
                        console.log('Service Worker registration failed:', error);
                    });

                let refreshing = false;
                const hadController = Boolean(navigator.serviceWorker.controller);
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (hadController && !refreshing) {
                        refreshing = true;
                        window.location.reload();
                    }
                });
            } else {
                console.log('Service Worker disabled in development mode');
            }
        }
    </script>

    <script type="module">
        import { songDB } from './songDB.js';
        import { createHymnVideoLink } from './hymn-video.js';
        const DYNAMIC_HYMNS_CACHE_KEY = 'dynamicHymnsCache:v1';
        const LIVE_CREATE_DYNAMIC_HYMN_URL = 'https://us-central1-shige-app-2022.cloudfunctions.net/createDynamicHymn';
        let dynamicHymns = [];
        let allHymns = [...songDB];

        function normalizeHymn(rawHymn) {
            return {
                ...rawHymn,
                id: String(rawHymn.id || `${rawHymn.edition}-${rawHymn.hymnID}`),
                hymnID: String(rawHymn.hymnID || '').trim(),
                edition: String(rawHymn.edition || '').trim(),
                html: String(rawHymn.html || ''),
                title: String(rawHymn.title || ''),
                searchText: String(rawHymn.searchText || '')
            };
        }

        function mergeHymnLists(baseHymns, addedHymns) {
            const merged = new Map();

            baseHymns.map(normalizeHymn).forEach(hymn => {
                merged.set(`${hymn.edition}:${hymn.hymnID}`, hymn);
            });

            addedHymns.map(normalizeHymn).forEach(hymn => {
                if (hymn.hymnID && ['ch', 'ts', 'user_upload'].includes(hymn.edition) && hymn.html) {
                    merged.set(`${hymn.edition}:${hymn.hymnID}`, hymn);
                }
            });

            return [...merged.values()];
        }

        function loadCachedDynamicHymns() {
            try {
                const cached = localStorage.getItem(DYNAMIC_HYMNS_CACHE_KEY);
                return cached ? JSON.parse(cached) : [];
            } catch (error) {
                console.warn('Unable to load cached dynamic hymns:', error);
                return [];
            }
        }

        function saveCachedDynamicHymns(hymns) {
            try {
                localStorage.setItem(DYNAMIC_HYMNS_CACHE_KEY, JSON.stringify(hymns));
            } catch (error) {
                console.warn('Unable to cache dynamic hymns:', error);
            }
        }

        async function refreshDynamicHymns() {
            dynamicHymns = loadCachedDynamicHymns();
            allHymns = mergeHymnLists(songDB, dynamicHymns);

            if (!navigator.onLine) {
                return;
            }

            try {
                const response = await fetch('/api/getDynamicHymns', { cache: 'no-store' });

                if (!response.ok) {
                    throw new Error(`Dynamic hymns request failed: ${response.status}`);
                }

                const data = await response.json();
                dynamicHymns = Array.isArray(data.hymns) ? data.hymns : [];
                saveCachedDynamicHymns(dynamicHymns);
                allHymns = mergeHymnLists(songDB, dynamicHymns);
            } catch (error) {
                console.warn('Using cached dynamic hymns:', error);
            }
        }

        // Function to find all objects with the same hymnID
        // Example usage
        // document.addEventListener('DOMContentLoaded', () => {
        //     const hymnIDToFind = '248';
        //     const matchingObjects = findObjectsWithHymnID(hymnIDToFind);
        //     const matchingHymn = findObjectsWithEdition(matchingObjects, 'ch')
        //     console.log(matchingHymn);
        // });

        function findObjectsWithHymnID(hymnID) {
            return allHymns.filter(song => song.hymnID === hymnID);
        }
        function findObjectsWithEdition(matchingObjects, edition) {
            return matchingObjects.filter(song => song.edition === edition);
        }

        function isAdminAddHymnRoute() {
            return window.location.pathname.replace(/\/$/, '') === '/admin/add-hymn';
        }

        function getCreateDynamicHymnUrl() {
            const isLocalhost = window.location.hostname === 'localhost' ||
                window.location.hostname === '127.0.0.1';

            return isLocalhost ? LIVE_CREATE_DYNAMIC_HYMN_URL : '/api/createDynamicHymn';
        }

        // Extract text content from HTML string
        function extractTextFromHTML(htmlString) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = htmlString;
            return tempDiv.textContent || tempDiv.innerText || '';
        }

        // Search hymns by lyrics content
        function searchHymnsByLyrics(query) {
            if (!query || query.trim() === '') {
                return [];
            }

            const searchTerm = query.toLowerCase().trim();
            const results = [];

            allHymns.forEach(song => {
                const text = `${song.title || ''} ${song.searchText || ''} ${extractTextFromHTML(song.html)}`.toLowerCase();
                if (text.includes(searchTerm)) {
                    // Find a snippet around the match for preview
                    const index = text.indexOf(searchTerm);
                    const start = Math.max(0, index - 30);
                    const end = Math.min(text.length, index + searchTerm.length + 30);
                    let preview = text.substring(start, end);

                    if (start > 0) preview = '...' + preview;
                    if (end < text.length) preview = preview + '...';

                    results.push({
                        id: song.id,
                        hymnID: song.hymnID,
                        edition: song.edition,
                        html: song.html,
                        title: song.title,
                        preview: preview
                    });
                }
            });

            return results;
        }

        // Display search results
        function displaySearchResults(results) {
            const resultsContainer = document.getElementById('search-results');

            if (results.length === 0) {
                resultsContainer.innerHTML = '<p class="search-empty-state">No hymns found</p>';
                return;
            }

            let html = '';
            results.forEach(result => {
                const editionLabel = result.edition === 'ch' ? '大本' : result.edition === 'ts' ? '小本' : '上傳';
                html += `
                    <div class="search-result-item" data-hymn-id="${result.hymnID}" data-edition="${result.edition}">
                        <div>
                            <span class="search-result-number">#${result.hymnID}</span>
                            <span class="search-result-edition">${editionLabel}</span>
                        </div>
                        <div class="search-result-preview">${result.preview}</div>
                    </div>
                `;
            });

            resultsContainer.innerHTML = html;
        }

        // Main function to search and display hymn
        async function searchHymn() {
            const inputField = document.getElementById('input-field');
            const inputValue = inputField.value.trim();

            // Don't search if landing page is still visible
            const landingPage = document.getElementById('landing-page');
            if (landingPage && !landingPage.classList.contains('hidden')) {
                return;
            }

            // Error checking for input value
            if (inputValue === '') {
                document.getElementById('app').innerHTML = '';
                return;
            }

            let labelSize = '';
            const radioLarge = document.getElementById('radio-large');
            const radioSmall = document.getElementById('radio-small');

            // Get value of selected radio button
            if (radioLarge.checked) {
                labelSize = radioLarge.value;
            } else if (radioSmall.checked) {
                labelSize = radioSmall.value;
            } else {
                alert('Please select a label size.');
                return;
            }
            console.log( 'daben or xiaoben: ', labelSize, inputValue )
            const matchingObjects = findObjectsWithHymnID(inputValue);
            console.log(matchingObjects);
            const matchingHymn = findObjectsWithEdition(matchingObjects, labelSize)
            console.log(matchingHymn);
            if (matchingHymn.length === 1) {
                document.getElementById('app').innerHTML = matchingHymn[0].html
            } else {
                const shigeben = labelSize === 'ch' ? '大本' : '小本'
                const notFoundMessage = `
                    <div style="text-align: center; padding: 40px 20px; color: #666;">
                        <h2 style="color: #e74c3c; margin-bottom: 10px;">找不到詩歌</h2>
                        <p style="font-size: 1.2em;">沒找到 ${shigeben} 詩歌 第 ${inputValue} 首</p>
                        <p>請確認詩歌編號是否正確</p>
                    </div>
                `;
                document.getElementById('app').innerHTML = notFoundMessage;
                console.log(`沒找到 ${shigeben} 詩歌 第 ${inputValue} 首`)
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const increaseFontBtn = document.getElementById('increase-font-btn');
            const decreaseFontBtn = document.getElementById('decrease-font-btn');
            const inputField = document.getElementById('input-field');
            const radioLarge = document.getElementById('radio-large');
            const radioSmall = document.getElementById('radio-small');
            const hymnVideo = createHymnVideoLink(document.getElementById('youtube-fab'));
            const navbarToggleBtn = document.getElementById('navbar-toggle-btn');
            const navbar = document.querySelector('.navbar');
            const container = document.querySelector('.container');
            const landingPage = document.getElementById('landing-page');
            const enterAppBtn = document.getElementById('enter-app-btn');

            function showAdminStatus(message, type = '') {
                const status = document.getElementById('admin-status');
                status.textContent = message;
                status.className = `admin-status ${type}`;
            }

            function renderAdminPreview() {
                document.getElementById('admin-preview-content').innerHTML =
                    document.getElementById('admin-html').value;
            }

            function initAddHymnAdminPage() {
                document.title = 'Add Dynamic Hymn';
                landingPage.classList.add('hidden');
                document.querySelector('.navbar').hidden = true;
                navbarToggleBtn.hidden = true;
                container.hidden = true;
                document.getElementById('search-fab').hidden = true;
                document.getElementById('admin-add-hymn-page').hidden = false;

                const savedToken = localStorage.getItem('dynamicHymnAdminToken') || '';
                document.getElementById('admin-token').value = savedToken;

                document.getElementById('admin-preview-btn').addEventListener('click', renderAdminPreview);

                document.getElementById('admin-add-hymn-form').addEventListener('submit', async event => {
                    event.preventDefault();
                    showAdminStatus('Saving...');

                    const token = document.getElementById('admin-token').value.trim();
                    const payload = {
                        hymnID: document.getElementById('admin-hymn-id').value.trim(),
                        edition: document.getElementById('admin-edition').value,
                        title: document.getElementById('admin-title').value.trim(),
                        html: document.getElementById('admin-html').value.trim(),
                        searchText: document.getElementById('admin-search-text').value.trim(),
                        youtubeUrl: document.getElementById('admin-youtube-url').value.trim(),
                        published: document.getElementById('admin-published').checked
                    };

                    try {
                        const response = await fetch(getCreateDynamicHymnUrl(), {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        });
                        const data = await response.json().catch(() => ({}));

                        if (!response.ok) {
                            throw new Error(data.error || `Request failed: ${response.status}`);
                        }

                        localStorage.setItem('dynamicHymnAdminToken', token);
                        showAdminStatus(`Saved ${data.collection}/${data.id}`, 'success');
                        renderAdminPreview();
                    } catch (error) {
                        showAdminStatus(error.message, 'error');
                    }
                });
            }

            if (isAdminAddHymnRoute()) {
                initAddHymnAdminPage();
                return;
            }

            refreshDynamicHymns().then(() => {
                searchHymn();
            });

            window.addEventListener('online', () => {
                refreshDynamicHymns().then(() => {
                    searchHymn();
                });
            });

            window.addEventListener('offline', () => hymnVideo.refresh());
            window.addEventListener('online', () => hymnVideo.refresh());

            // Radio button changes
            radioLarge.addEventListener('change', async function() {
                await searchHymn();
                const edition = radioLarge.checked ? 'ch' : 'ts';
                hymnVideo.select(inputField.value, edition, 500);
            });

            radioSmall.addEventListener('change', async function() {
                await searchHymn();
                const edition = radioSmall.checked ? 'ts' : 'ch';
                hymnVideo.select(inputField.value, edition, 500);
            });

            // Input field changes
            inputField.addEventListener('input', async function() {
                await searchHymn();
                const edition = radioLarge.checked ? 'ch' : 'ts';
                hymnVideo.select(inputField.value, edition, 500);
            });


            // Increase font size button functionality
            increaseFontBtn.addEventListener('click', function() {
                const container = document.getElementById('app');
                const currentFontSize = parseFloat(getComputedStyle(container).fontSize);
                const newFontSize = currentFontSize + 2;
                container.style.fontSize = `${newFontSize}px`;
            });

            // Decrease font size button functionality
            decreaseFontBtn.addEventListener('click', function() {
                const container = document.getElementById('app');
                const currentFontSize = parseFloat(getComputedStyle(container).fontSize);
                const newFontSize = currentFontSize - 2;
                container.style.fontSize = `${newFontSize}px`;
            });

            // Search panel functionality
            const searchFab = document.getElementById('search-fab');
            const searchPanel = document.getElementById('search-panel');
            const closeSearchBtn = document.getElementById('close-search');
            const searchInput = document.getElementById('search-input');

            // Open search panel
            searchFab.addEventListener('click', function() {
                searchPanel.classList.add('open');
                // Auto-focus search input
                setTimeout(() => {
                    searchInput.focus();
                }, 300);
            });

            // Close search panel
            closeSearchBtn.addEventListener('click', function() {
                searchPanel.classList.remove('open');
                searchInput.value = '';
                document.getElementById('search-results').innerHTML = '<p class="search-empty-state">Enter keywords to search hymns</p>';
            });

            // Close on ESC key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && searchPanel.classList.contains('open')) {
                    searchPanel.classList.remove('open');
                    searchInput.value = '';
                    document.getElementById('search-results').innerHTML = '<p class="search-empty-state">Enter keywords to search hymns</p>';
                }
            });

            // Search input event listener
            searchInput.addEventListener('input', function() {
                const query = searchInput.value.trim();

                if (query === '') {
                    document.getElementById('search-results').innerHTML = '<p class="search-empty-state">Enter keywords to search hymns</p>';
                    return;
                }

                const results = searchHymnsByLyrics(query);
                displaySearchResults(results);

                // Add click handlers to results
                document.querySelectorAll('.search-result-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const hymnID = this.getAttribute('data-hymn-id');
                        const edition = this.getAttribute('data-edition');

                        // Find and display the hymn
                        const matchingObjects = findObjectsWithHymnID(hymnID);
                        const matchingHymn = findObjectsWithEdition(matchingObjects, edition);

                        if (matchingHymn.length === 1) {
                            document.getElementById('app').innerHTML = matchingHymn[0].html;

                            // Update the radio button selection
                            if (edition === 'ch') {
                                document.getElementById('radio-large').checked = true;
                            } else {
                                document.getElementById('radio-small').checked = true;
                            }

                            // Update the hymn number input field
                            document.getElementById('input-field').value = hymnID;

                            // Load the recording for the exact selected hymn, including uploads.
                            hymnVideo.select(hymnID, edition);

                            // Close the search panel after selecting a hymn
                            searchPanel.classList.remove('open');
                            searchInput.value = '';
                        }
                    });
                });
            });

            // Navbar toggle button click handler
            navbarToggleBtn.addEventListener('click', function() {
                navbar.classList.toggle('hidden');
                container.classList.toggle('navbar-hidden');
                navbarToggleBtn.classList.toggle('navbar-hidden');

                // Save state to localStorage
                const isHidden = navbar.classList.contains('hidden');
                localStorage.setItem('navbarHidden', isHidden);
            });

            // Restore navbar state from localStorage on page load
            const navbarHidden = localStorage.getItem('navbarHidden') === 'true';
            if (navbarHidden) {
                navbar.classList.add('hidden');
                container.classList.add('navbar-hidden');
                navbarToggleBtn.classList.add('navbar-hidden');
            }

            // Landing page enter button handler
            enterAppBtn.addEventListener('click', function() {
                // Hide landing page
                landingPage.classList.add('hidden');

                // Set to big book hymn 1
                radioLarge.checked = true;
                inputField.value = '1';
                searchHymn();

                // Load the saved YouTube recording
                const edition = 'ch';
                hymnVideo.select('1', edition);
            });
        });
    </script>

    <a id="youtube-fab" class="youtube-fab" target="_blank" rel="noopener noreferrer"
